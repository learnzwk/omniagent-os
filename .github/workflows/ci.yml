name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy, llvm-tools-preview
          targets: x86_64-unknown-none
      - name: Build kernel
        run: cargo build -p omniagent-kernel --target x86_64-unknown-none
      - name: Build workspace
        run: cargo build --workspace --exclude omniagent-kernel --target x86_64-unknown-linux-gnu

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none
      - name: Run tests
        run: cargo test --workspace --exclude omniagent-kernel --target x86_64-unknown-linux-gnu

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude omniagent-kernel --target x86_64-unknown-linux-gnu -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build docs
        run: cargo doc --workspace --exclude omniagent-kernel --no-deps --target x86_64-unknown-linux-gnu
