[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
runner = "bootimage runner"
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-Tkernel/src/arch/x86_64/linker.ld",
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-C", "panic=abort",
]


